<!DOCTYPE html>
<html>
<head lang="uk">
    <meta charset="UTF-8">
    <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="main.css" />
</head>


<body class="background">

<div class="container">
<div class="product-item">
    <form class="item add-row">
        <input type="text" placeholder="Назва товару" class="input-add-text" id="addProductName">
        <button type="button" class="add-button" data-tooltip="Додати новий товар" id="addProductButton">Додати</button>
    </form>
    <ul class="list" id="listContainer">

        <li>
            <div class="item">
                <span class="item-name">Помідори</span>
                <div class="item-quantity">
                    <button class="dec-item" data-tooltip="Видалити товар">-</button>
                    <span class="amount">1</span>
                    <button class="inc-item" data-tooltip="Додати товар">+</button>
                </div>
                <div class="item-actions">
                    <span class="bought">Не куплено</span>
                    <button class="del-item" data-tooltip="Видалити товар" id="delButton">х</button>
                </div>
            </div>
        </li>


        <li>
            <div class="item">
                <span class="item-name">Печиво</span>
                <div class="item-quantity">
                    <button class="dec-item" data-tooltip="Видалити товар">-</button>
                    <span class="amount">2</span>
                    <button class="inc-item" data-tooltip="Додати товар">+</button>
                </div>
                <div class="item-actions">
                    <span class="bought">Не куплено</span>
                    <button class="del-item" data-tooltip="Видалити товар" id="delButton">х</button>
                </div>
            </div>
        </li>

        <li>
            <div class="item">
                <span class="item-name">Сир</span>
                <div class="item-quantity">
                    <button disabled class="dec-item" data-tooltip="Видалити товар" id="decBtn">-</button>
                    <span class="amount">1</span>
                    <button class="inc-item" data-tooltip="Додати товар">+</button>
                </div>
                <div class="item-actions">
                    <span class="bought">Не куплено</span>
                    <button class="del-item" data-tooltip="Видалити товар" id="delButton">х</button>
                </div>
            </div>
        </li>
    </ul>

</div>


    <div class="product-item">

    <h2 class="header stats-group">Залишилося</h2>
    <div class="stats-group" id="leftToBuyContainer">

    </div>

    <h2 class="header stats-group">Куплено</h2>
    <div class="stats-group-last" id="boughtContainer">

    </div>


</div>


    <div class="author-badge">
        <div class="badge-title">Buy List</div>
        <div class="badge-author">Роботу виконала Матящук Анна</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
