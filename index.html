<!DOCTYPE html>
<html>
<head lang="uk">
    <meta charset="UTF-8">
    <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="main.css" />
</head>


<body class="background">

<div class="container">
<div class="product-item">
    <form class="item add-row">
        <input type="text" placeholder="Назва товару" class="input-add-text">
        <button type="sumbit" class="add-button" data-tooltip="Додати новий товар">Додати</button>
    </form>
    <ul class="list">

        <li class="item">

            <s>Помідори</s>

            <div class="item-quantity">
                <span class="amount">2</span>
            </div>
            <div class="item-actions">
                <span class="bought">Не куплено</span>
                </div>


        </li>


        <li>
            <div class="item">
                Печиво
                <div class="item-quantity">
                    <button class="dec-item" data-tooltip="Видалити товар">-</button>
                    <span class="amount">2</span>
                    <button class="inc-item" data-tooltip="Додати товар">+</button>
                </div>
                <div class="item-actions">
                    <span class="bought">Куплено</span>
                    <button class="del-item" data-tooltip="Видалити товар">х</button>
                </div>
            </div>
        </li>

        <li>
            <div class="item">
                <input type="text" value="Сир" class="input-text">
                <div class="item-quantity">
                    <button disabled class="dec-item" data-tooltip="Видалити товар">-</button>
                    <span class="amount">1</span>
                    <button class="inc-item" data-tooltip="Додати товар">+</button>
                </div>
                <div class="item-actions">
                    <span class="bought">Куплено</span>
                    <button class="del-item" data-tooltip="Видалити товар">х</button>
                </div>
            </div>
        </li>
    </ul>

</div>


    <div class="product-item">

    <h2 class="header stats-group">Залишилося</h2>
    <div class="stats-group">
        <span class="bought-amount">Печиво
            <span class="bought-amount-number">2</span>
        </span>


        <span class="bought-amount">Сир
            <span class="bought-amount-number">1</span></span>
    </div>

    <h2 class="header stats-group">Куплено</h2>
    <div class="stats-group-last">
        <span class="bought-amount"><s>Помідори</s>
            <span class="bought-amount-number">2</span></span>
    </div>


</div>


    <div class="author-badge">
        <div class="badge-title">Buy List</div>
        <div class="badge-author">Роботу виконала Матящук Анна</div>
    </div>


</body>
</html>
